<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn tập JPD113</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--pink:#f43f5e;--pink-bg:#fff1f3;--purple:#a855f7;--purple-bg:#faf5ff;--indigo:#6366f1;--indigo-bg:#eef2ff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--ok:#15803d;--ok-bg:#dcfce7;--warn:#a16207;--warn-bg:#fef9c3;--no:#b91c1c;--no-bg:#fee2e2}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:#fff7f8;color:var(--text);line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{text-align:center;font-size:28px;margin:8px 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.lesson{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px}
.lesson h2{text-align:center;font-size:28px;margin:0 0 16px}
.sec{border-radius:12px;padding:14px;margin-bottom:14px;border:1px solid var(--border)}
.sec h3{margin:0 0 10px;font-size:20px}
.sec.v{background:var(--pink-bg)}.sec.v h3{color:var(--pink)}
.sec.k{background:var(--purple-bg)}.sec.k h3{color:var(--purple)}
.sec.g{background:var(--indigo-bg)}.sec.g h3{color:var(--indigo)}
.btn{display:block;width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:16px;font-weight:600;cursor:pointer;color:inherit}
.btn:hover{filter:brightness(.97)}
.sec.v .btn{color:var(--pink)}.sec.v .btn.fill{background:var(--pink);color:#fff;border:none}
.sec.k .btn{color:var(--purple)}.sec.k .btn.fill{background:var(--purple);color:#fff;border:none}
.sec.g .btn{color:var(--indigo)}.sec.g .btn.fill{background:var(--indigo);color:#fff;border:none}
.back{background:none;border:none;font-size:17px;cursor:pointer;color:var(--text);padding:4px 0;margin-bottom:12px}
.panel{background:#fff;border:1px solid var(--border);border-radius:16px;padding:24px;max-width:720px;margin:0 auto}
.panel.wide{max-width:1000px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.head h2{margin:0;font-size:22px;color:#d97706}
.tag{display:inline-block;font-size:13px;padding:2px 10px;border-radius:999px;background:var(--indigo-bg);color:var(--indigo);font-weight:600}
.q{font-size:18px;text-align:center;margin:12px 0}
.jp{font-size:30px;text-align:center;margin:4px 0 14px;font-weight:600;color:#b45309}
input[type=text]{width:100%;font-size:18px;padding:12px 14px;border:2px solid #111;border-radius:10px;outline:none}
input[type=text]:focus{border-color:#f59e0b}
.err{color:var(--no);font-size:14px;min-height:20px;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row button{flex:1;min-width:110px;padding:11px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:15px;font-weight:600;cursor:pointer}
.row button.main{background:#f59e0b;color:#fff;border:none}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:16px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}.fb.warn{background:var(--warn-bg);color:var(--warn)}.fb.no{background:var(--no-bg);color:var(--no)}.fb.info{background:#f3f4f6}
.fb .big{font-size:22px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#f9fafb}
.tbl{overflow-x:auto}
.card{min-height:280px;border:2px solid var(--border);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;cursor:pointer;text-align:center;user-select:none;background:#fff}
.card .front{font-size:46px;font-weight:700}
.card .sub{font-size:18px;color:var(--muted)}
.card .back{font-size:17px;text-align:left;width:100%}
.card .meaning{font-size:26px;font-weight:700;color:var(--pink);text-align:center;margin-bottom:6px}
.hint{color:var(--muted);font-size:14px;text-align:center;margin-top:8px}
.gcard{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.gcard h4{margin:0 0 4px;font-size:18px;color:var(--indigo)}
.gcard .m{color:var(--muted);margin-bottom:8px}
.kp{white-space:nowrap;color:#e11d48;background:#ffe4e6;padding:0 4px;border-radius:4px;font-weight:700;font-style:normal}
.kq{white-space:nowrap;color:#b45309;background:#fef3c7;padding:0 4px;border-radius:4px;font-weight:700;font-style:normal}
.legend{font-size:14px;color:var(--muted)}
.grow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 12px;border-top:1px solid var(--border);padding:10px 0;font-size:15px}
.glbl{color:var(--muted);font-weight:600}
.gst{display:inline-block;font-weight:600;color:var(--indigo);background:var(--indigo-bg);padding:3px 10px;border-radius:6px;margin-bottom:6px}
@media (max-width:520px){.grow{grid-template-columns:1fr}}
.ro{color:var(--muted);font-style:italic}
.score{font-size:15px;color:var(--muted)}
.rlesson{margin-top:24px}.rlesson .rsec{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.rlesson .rsec .btn{margin:0}.rnote{color:var(--muted);font-size:14px;margin:4px 0 12px}
.topics{display:flex;flex-direction:column;gap:8px}
.topics .btn{margin:0;display:flex;justify-content:space-between;align-items:center;text-align:left;color:var(--pink)}
.topics .btn.fill{background:var(--pink);color:#fff;border:none}
.trow td{background:var(--pink);color:#fff;font-weight:700;font-size:15px}
.topics .cnt{font-weight:400;font-size:14px;opacity:.85}
.done{text-align:center}
.done .big{font-size:40px;font-weight:700;color:#d97706}
</style>
</head>

const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const isJP=s=>/[\u3040-\u30ff\u4e00-\u9faf]/.test(s);
function strictRo(s){return s.toLowerCase().replace(/ā/g,"aa").replace(/ī/g,"ii").replace(/ū/g,"uu").replace(/ē/g,"ee").replace(/ō/g,"ou").replace(/\bwo\b/g,"o").replace(/[^a-z0-9]/g,"").replace(/oo/g,"ou")}
function looseRo(s){return strictRo(s).replace(/ou/g,"o").replace(/uu/g,"u").replace(/aa/g,"a").replace(/ii/g,"i").replace(/ee/g,"e").replace(/nn/g,"n")}
function normKana(s){return s.replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/[\s～〜~、。？?！!「」『』（）()・]/g,"").toLowerCase()}
function normVN(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/[^a-z0-9]/g,"")}
function optForms(s){return s.includes("(お)")||s.includes("（お）")||s.includes("(o)")?[s.replace(/[(（](お|o)[)）]/,"$1"),s.replace(/[(（](お|o)[)）]/,"")]:[s]}
const CTX=["watashiwa","maiasa","maiban","mainichi","maishuu","maitsuki","maitoshi","ashita","asatte","kyou","kinou","kesa","konban","kotoshi","raishuu","raigetsu","rainen","konshuu","shuumatsu","natsuyasumi","fuyuyasumi","haruyasumi","yasumi","getsuyoubi","kayoubi","suiyoubi","mokuyoubi","kin'youbi","kinyoubi","doyoubi","nichiyoubi"];
function stripCtx(s){let t=s,ch=true;while(ch){ch=false;for(const c of CTX){const k=c.replace(/[^a-z]/g,"");if(t.length>k.length&&t.startsWith(k)){t=t.slice(k.length);ch=true}}}return t}
function checkRomaji(input,answers){const s=strictRo(input),l=looseRo(input),s2=stripCtx(s),l2=looseRo(s2);if(answers.some(a=>{const A=strictRo(a);return A===s||A===s2}))return"ok";if(answers.some(a=>{const A=looseRo(a);return A===l||A===l2}))return"warn";return"no"}
const SYN=[["lợn","heo"],["ti vi","tivi"],["tv","tivi"],["cafe","cà phê"],["cà fê","cà phê"],["coffee","cà phê"],["máy vi tính","máy tính"],["laptop","máy tính"],["xe bus","xe buýt"],["wc","nhà vệ sinh"],["phô mát","phô mai"],["xa lát","salad"],["sa lát","salad"],["hoa quả","trái cây"],["thầy giáo","giáo viên"],["cô giáo","giáo viên"],["tiệm","cửa hàng"],["quán","cửa hàng"],["đá bóng","bóng đá"],["đá banh","bóng đá"],["mùa hạ","mùa hè"],["kì","kỳ"],["mĩ","mỹ"],["lí","lý"],["cn","chủ nhật"],["thứ 2","thứ hai"],["thứ 3","thứ ba"],["thứ 4","thứ tư"],["thứ 5","thứ năm"],["thứ 6","thứ sáu"],["thứ 7","thứ bảy"],["t2","thứ hai"],["t3","thứ ba"],["t4","thứ tư"],["t5","thứ năm"],["t6","thứ sáu"],["t7","thứ bảy"]];
const STOP=["cái","chiếc","quả","cục","tờ","con"],FILL=["đi","là","sự","ạ","cuốn"];
function vnClean(s,strip){s=s.normalize("NFC").toLowerCase();if(strip)s=s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d");return" "+s.replace(/[^\p{L}\p{N}]+/gu," ").trim()+" "}
function vnTokens(s,strip){
  s=vnClean(s,strip);
  for(const[a,b]of SYN){const A=vnClean(a,strip),B=vnClean(b,strip);while(s.includes(A))s=s.replace(A,B)}
  const t=s.trim().split(" ").filter(Boolean),stop=STOP.map(w=>vnClean(w,strip).trim()),k=t.filter(w=>!stop.includes(w));
  return new Set(k.length?k:t);
}
function checkVN(input,vn){
  const strip=input.normalize("NFD").replace(/[̀-ͯ]/g,"")===input.normalize("NFD")&&!/đ/i.test(input);
  const I=vnTokens(input,strip);if(!I.size)return"no";
  const alts=vn.split(/[\/,]/).flatMap(x=>{const out=[x,x.replace(/\([^)]*\)/g," ")];for(const m of x.matchAll(/\(([^)]*)\)/g))out.push(m[1]);return out});
  for(const alt of alts){
    const A=vnTokens(alt,strip);if(!A.size)continue;
    const inA=[...I].every(w=>A.has(w)),aIn=[...A].every(w=>I.has(w));
    if(inA&&aIn)return"ok";
    if(inA&&I.size/A.size>=0.8)return"ok";
    const fill=FILL.map(w=>vnClean(w,strip).trim());
    if(aIn&&[...I].every(w=>A.has(w)||fill.includes(w)))return"ok";
  }
  return"no";
}

function flash(title,cards){
  let order=cards.map((_,i)=>i),i=0,flipped=false;
  app.innerHTML=`${backBtn}<div class="panel"><div class="head"><h2>${title}</h2><span class="score" id="cnt"></span></div>
  <div class="card" id="card"></div><p class="hint">Bấm vào thẻ hoặc phím Space để lật · ← → để chuyển thẻ</p>
  <div class="row"><button id="prev">← Trước</button><button id="flip" class="main">Lật thẻ</button><button id="nxt">Sau →</button></div>
  <div class="row"><button id="shf">Xáo trộn</button></div></div>`;
  bindBack();
  const card=document.getElementById("card");
  function show(){const c=cards[order[i]];card.innerHTML=flipped?c.back:c.front;document.getElementById("cnt").textContent=`${i+1} / ${cards.length}`}
  const go=d=>{i=(i+d+cards.length)%cards.length;flipped=false;show()};
  card.onclick=document.getElementById("flip").onclick=()=>{flipped=!flipped;show()};
  document.getElementById("prev").onclick=()=>go(-1);
  document.getElementById("nxt").onclick=()=>go(1);
  document.getElementById("shf").onclick=()=>{order=shuffle(order);i=0;flipped=false;show()};
  document.onkeydown=e=>{if(!document.getElementById("card"))return;if(e.key===" "){e.preventDefault();flipped=!flipped;show()}if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)};
  show();
}

function quiz(title,items,{placeholder,checker,answerHTML}){
  const MSG={ok:"Chính xác!",warn:"Đúng rồi, chú ý trường âm / cách viết:",no:"Chưa đúng. Đáp án:",info:"Đáp án:"};
  let order,i,log;
  const start=o=>{order=o;i=0;log=[];render()};
  const score=()=>log.filter(x=>x&&(x.kind==="ok"||x.kind==="warn")).length;
  const scoreText=()=>`Câu ${i+1} / ${order.length} · Đúng: ${score()}`;
  function render(){
    if(i>=order.length)return finish();
    const q=items[order[i]],done=log[i];
    app.innerHTML=`${backBtn}<div class="panel"><div class="head"><h2>${title}</h2><span class="score" id="sc">${scoreText()}</span></div>
    ${q.tag?`<div style="text-align:center"><span class="tag">${esc(q.tag)}</span></div>`:""}
    <p class="q">${q.prompt}</p>${q.jp?`<div class="jp">${esc(q.jp)}</div>`:""}
    <input type="text" id="ans" placeholder="${placeholder}" autocomplete="off">
    <div class="err" id="err"></div>
    <div class="row">${i?`<button id="prv">← Câu trước</button>`:""}<button class="main" id="chk">Kiểm tra</button><button id="shw">Xem đáp án</button><button id="skp">Câu tiếp →</button></div>
    <div id="fb"></div></div>`;
    bindBack();
    const ans=document.getElementById("ans");
    if(done){ans.value=done.v;ans.readOnly=true;fb(done.kind)}else ans.focus();
    ans.oninput=()=>document.getElementById("err").textContent="";
    ans.onkeydown=e=>{if(e.key==="Enter")log[i]?next():check()};
    document.getElementById("chk").onclick=check;
    document.getElementById("shw").onclick=()=>{if(!log[i]){log[i]={v:ans.value.trim(),kind:"info"};ans.readOnly=true}fb(log[i].kind)};
    document.getElementById("skp").onclick=next;
    if(i)document.getElementById("prv").onclick=()=>{i--;render()};
  }
  function fb(kind){document.getElementById("fb").innerHTML=`<div class="fb ${kind}">${MSG[kind]}<br>${answerHTML(items[order[i]])}</div>`}
  function check(){
    if(log[i])return next();
    const ans=document.getElementById("ans"),v=ans.value.trim();
    if(!v){document.getElementById("err").textContent="Nhập câu trả lời trước nhé";return}
    const r=checker(items[order[i]],v);log[i]={v,kind:r};ans.readOnly=true;
    document.getElementById("sc").textContent=scoreText();fb(r);
  }
  function next(){i++;render()}
  function finish(){
    const wrong=order.filter((_,k)=>!log[k]||log[k].kind==="no"||log[k].kind==="info");
    app.innerHTML=`${backBtn}<div class="panel done"><h2 style="color:#d97706">${title}</h2><div class="big">${score()} / ${order.length}</div>
    <p>${wrong.length?`Có ${wrong.length} câu sai hoặc bỏ qua.`:"Không sai câu nào!"}</p>
    <div class="row"><button id="prv">← Xem lại câu trước</button>${wrong.length?`<button class="main" id="rw">Làm lại câu sai</button>`:""}<button id="ra">Làm lại tất cả</button></div></div>`;
    bindBack();
    document.getElementById("prv").onclick=()=>{i=order.length-1;render()};
    const rw=document.getElementById("rw");
    if(rw)rw.onclick=()=>start(shuffle(wrong));
    document.getElementById("ra").onclick=()=>start(shuffle(items.map((_,k)=>k)));
  }
  start(shuffle(items.map((_,k)=>k)));
}
function pickFrom(list,heading,run,sub,back){
  const topics=[...new Set(list.map(w=>w.topic))];
  app.innerHTML=`${backBtn}<div class="panel"><div class="head"><h2>${heading}</h2></div><p class="q">${sub||"Chọn chủ đề để kiểm tra"}</p><div class="topics">${topics.map((t,k)=>`<button class="btn" data-t="${k}">${esc(t)} <span class="cnt">${list.filter(w=>w.topic===t).length} từ</span></button>`).join("")}<button class="btn fill" data-t="all">Tất cả <span class="cnt">${list.length} từ</span></button></div></div>`;
  bindBack();
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const all=b.dataset.t==="all",t=topics[b.dataset.t];run(all?list:list.filter(w=>w.topic===t),all?"Tất cả":t);window.scrollTo(0,0)});
}
function pickTopic(n,title,run,sub){pickFrom(VOCAB[n],`${title} – Bài ${n}`,run,sub)}
function vocabQuiz1(n){pickTopic(n,"Kiểm tra: Kana → Nghĩa",(words,label)=>
  quiz(`Kiểm tra – Bài ${n} · ${esc(label)}`,words.map(w=>({w,prompt:"Nghĩa của từ này là gì?",jp:w.jp})),{
    placeholder:"Nhập nghĩa tiếng Việt (có dấu hoặc không dấu)",
    checker:(q,v)=>checkVN(v,q.w.vn),
    answerHTML:q=>`<span class="big">${esc(q.w.vn.replace(/\//g,", "))}</span><br>${esc(q.w.jp)} · <i>${esc(q.w.ro)}</i>`}));
}
function vocabQuiz2(n){
  const list=VOCAB[n];
  pickTopic(n,"Kiểm tra: Nghĩa → Kana",(words,label)=>
  quiz(`Kiểm tra – Bài ${n} · ${esc(label)}`,words.map(w=>({w,prompt:`Viết phiên âm của từ: <b style="color:#b45309">"${esc(w.vn.replace(/\//g,", "))}"</b><br><span class="tag">${kanaType(w)}</span>`})),{
    placeholder:"Gõ kana (いちご) hoặc romaji (ichigo)",
    checker:(q,v)=>{
      const qa=q.w.vn.split("/").map(normVN);const cands=list.filter(x=>x===q.w||x.vn.split("/").map(normVN).some(a=>qa.includes(a)));
      if(isJP(v)){const iv=normKana(v);return cands.some(x=>[x.jp,x.alt,x.kanji].filter(Boolean).flatMap(optForms).some(f=>normKana(f)===iv))?"ok":"no"}
      return checkRomaji(v,cands.flatMap(x=>optForms(x.ro)));
    },
    answerHTML:q=>`<span class="big">${esc(q.w.jp)}</span>${q.w.kanji?" ("+esc(q.w.kanji)+")":""} · <i>${esc(q.w.ro)}</i>`}));
}
function gramQuiz(n){
  quiz(`Ngữ pháp – Bài ${n}`,GQUIZ[n].map(q=>({...q,tag:q.t,prompt:esc(q.p),jp:q.j||""})),{
    placeholder:"Gõ romaji, vd: toire wa doko desu ka",
    checker:(q,v)=>checkRomaji(v,q.a),
    answerHTML:q=>`<span class="big">${esc(q.k)}</span><br><i>${esc(q.a[0])}</i>`});
}
const HV={};for(const n in KANJI)for(const k of KANJI[n])HV[k.k]=k.hv.toLowerCase();
const hvOf=w=>[...w].every(c=>HV[c])?[...w].map(c=>HV[c]).join(" "):"";
function kanjiItems(n){
  const items=[],seen=new Set();
  for(const k of KANJI[n]){
    const a=!k.alone.startsWith("✗")&&k.alone.match(/^(\S+) \(([^)]+)\)/);
    if(a&&!seen.has(k.k)){seen.add(k.k);items.push({w:k.k,kana:a[1],ro:a[2],vn:k.vn,hv:hvOf(k.k)})}
    for(const x of k.c){const[w,kn,ro,m]=x.split("|");if(!seen.has(w)){seen.add(w);items.push({w,kana:kn,ro,vn:m,hv:hvOf(w)})}}
  }
  return items;
}
const kanjiAnswer=q=>`<span class="big">${esc(q.w)}</span> ${esc(q.kana)} · <i>${esc(q.ro)}</i><br>${esc(q.vn)}${q.hv?` · Hán Việt: ${esc(q.hv.toUpperCase())}`:""}`;
function kanjiQuiz1(n){
  const mean=m=>m.split(/[,/]/).flatMap(x=>{const p=x.match(/^(.*?)\s*\((.*)\)\s*$/);return p?[p[1],p[2]]:[x]}).map(x=>x.trim()).filter(Boolean).join("/");
  quiz(`Kanji → Nghĩa – Bài ${n}`,kanjiItems(n).map(q=>({...q,prompt:"Nghĩa tiếng Việt của từ này là gì?",jp:q.w})),{
    placeholder:"Nhập nghĩa tiếng Việt (có dấu hoặc không dấu)",
    checker:(q,v)=>checkVN(v,mean(q.vn)+(q.hv?"/"+q.hv:"")),
    answerHTML:kanjiAnswer});
}
function kanjiQuiz2(n){
  quiz(`Kanji → Phiên âm – Bài ${n}`,kanjiItems(n).map(q=>({...q,prompt:"Từ này đọc như thế nào?",jp:q.w})),{
    placeholder:"Gõ kana (にほん) hoặc romaji (nihon)",
    checker:(q,v)=>isJP(v)?(optForms(q.kana).some(f=>normKana(f)===normKana(v))?"ok":"no"):checkRomaji(v,[q.ro]),
    answerHTML:kanjiAnswer});
}
const rkAlt=x=>x.split("/");
const rkAnswer=q=>`<span class="big">${esc(q.w)}</span> ${esc(q.kana.replace(/\//g," / "))} · <i>${esc(q.ro.replace(/\//g," / "))}</i><br>${esc(q.vn.replace(/\//g,", "))}<br><span class="rnote">Đoạn ${esc(q.d)}</span>`;
function readList(){pickFrom(RK,"Kanji trong Reading",(words,label)=>{
  let prev="";const rows=words.map((w,i)=>{const h=label==="Tất cả"&&w.topic!==prev?`<tr class="trow"><td colspan="6">${esc(w.topic)}</td></tr>`:"";prev=w.topic;return h+`<tr><td>${i+1}</td><td style="font-size:20px">${esc(w.w)}</td><td>${esc(w.kana.replace(/\//g," / "))}</td><td class="ro">${esc(w.ro.replace(/\//g," / "))}</td><td>${esc(w.vn.replace(/\//g,", "))}</td><td>${esc(w.d)}</td></tr>`}).join("");
  app.innerHTML=`<button class="back" id="back">← Chọn chủ đề khác</button><div class="panel wide"><div class="head"><h2>Kanji trong Reading · ${esc(label)}</h2><span class="score">${words.length} từ</span></div><div class="tbl"><table><tr><th>#</th><th>Kanji</th><th>Cách đọc</th><th>Romaji</th><th>Nghĩa</th><th>Đoạn</th></tr>${rows}</table></div></div>`;
  document.getElementById("back").onclick=()=>{readList();window.scrollTo(0,0)};
},"Chọn chủ đề để xem")}
function readFlash(){pickFrom(RK,"Flashcard – Kanji trong Reading",(words,label)=>
  flash(`Flashcard Reading · ${esc(label)}`,words.map(w=>({
    front:`<div class="front">${esc(w.w)}</div>`,
    back:`<div class="meaning">${esc(w.vn.replace(/\//g,", "))}</div><div class="sub">${esc(w.w)} · ${esc(w.kana.replace(/\//g," / "))} · <i>${esc(w.ro.replace(/\//g," / "))}</i></div><div class="sub">Đoạn ${esc(w.d)}</div>`}))),"Chọn chủ đề để học")}
function readQuiz1(){pickFrom(RK,"Kiểm tra: Kanji → Nghĩa (Reading)",(words,label)=>
  quiz(`Reading: Kanji → Nghĩa · ${esc(label)}`,words.map(q=>({...q,prompt:"Nghĩa tiếng Việt của từ này là gì?",jp:q.w})),{
    placeholder:"Nhập nghĩa tiếng Việt (có dấu hoặc không dấu)",
    checker:(q,v)=>{const hv=hvOf(q.w);return checkVN(v,q.vn+(hv?"/"+hv:""))},
    answerHTML:rkAnswer}))}
function readQuiz2(){pickFrom(RK,"Kiểm tra: Kanji → Cách đọc (Reading)",(words,label)=>
  quiz(`Reading: Kanji → Cách đọc · ${esc(label)}`,words.map(q=>({...q,prompt:"Từ này đọc như thế nào?",jp:q.w})),{
    placeholder:"Gõ kana (がっこう) hoặc romaji (gakkou)",
    checker:(q,v)=>isJP(v)?(rkAlt(q.kana).some(f=>normKana(f)===normKana(v))?"ok":"no"):checkRomaji(v,rkAlt(q.ro)),
    answerHTML:rkAnswer}))}
const ROUTES={vlist:vocabList,vflash:vocabFlash,vquiz1:vocabQuiz1,vquiz2:vocabQuiz2,klist:kanjiList,kflash:kanjiFlash,kquiz1:kanjiQuiz1,kquiz2:kanjiQuiz2,gview:gramView,gquiz:gramQuiz,rlist:readList,rflash:readFlash,rquiz1:readQuiz1,rquiz2:readQuiz2};
home();
</script>
